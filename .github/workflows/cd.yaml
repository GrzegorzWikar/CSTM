name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

env:
  SOLUTION: backend/CSTM API.slnx
  API_PROJECT: backend/CSTM API/CSTM API.csproj
  FRONTEND_DIR: frontend
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 22
  AZURE_WEBAPP_NAME: cstm-vkqwu2zyqb4h6-api
  API_URL: https://cstm-vkqwu2zyqb4h6-api.azurewebsites.net

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs: 
  build-api:
    name: API (build, test, publish)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore "${{ env.SOLUTION }}"
      - name: Build
        run: dotnet build "${{ env.SOLUTION }}" --no-restore --configuration Relese
      - name: Test
        run: dotnet test "${{ env.SOLUTION }}" --no-buld --coniguraion Relese
      - name: Publish
        run: dotnet publish "${{ env.SOLUTION }}" --no-build --configuration Relese --output "${{ runner.temp }}/api"
      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: ${{ runner.temp }}/api
          if-no-files-found: error
  
  build-web:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
      - name: Install
        run: npm ci
        working-directory: ${{ env.FRONTEND_DIR }}
      - name: Build (tsc + vite)
        run: npm run build
        working-directory: ${{ env.FRONTEND_DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: ${{ env.FRONTEND_DIR }}/dist
          if-no-files-found: error
  
  deploy-api:
    name: Deploy API
    needs: build-api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ env.API_URL }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: api
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscripion-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: api
      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$API_URL/api/ickets" || true)
            echo "Proba $i: HTTP $code"
            if [ "$code" = "401"]; then
              echo "API replaing correctly"
              exit 0
            fi
            sleep 10
          done
          echo "The API didn't return the expected 401 code."
          exit 1
      
      - name: Azure logout
        if: always()
        run: az logout
  
  deploy-web:
    name: Deploy frontend
    needs: [build-web, deploy-api]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          actions: upload
          app_location: web
          skip_app_build: true
          skip_api_build: true